plugins { id 'fabric-loom' version '1.6.12' }
version = '0.9.7'
group = 'br.com.vozdacriacao'
base { archivesName = 'la-craft' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
    implementation('com.alphacephei:vosk:0.3.45') { transitive = false }
    include 'com.alphacephei:vosk:0.3.45'
    modImplementation 'com.terraformersmc:modmenu:7.2.2'
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.5.0'
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}

tasks.register('testarPlanosIA', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.com.vozdacriacao.PlanosIATest'
}
tasks.named('check') { dependsOn testarPlanosIA }

tasks.register('testarReconhecimento', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.com.vozdacriacao.ReconhecimentoTest'
}
tasks.named('check') { dependsOn testarReconhecimento }

tasks.register('testarResidencia', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.com.vozdacriacao.ResidenciaTest'
}
tasks.named('check') { dependsOn testarResidencia }

tasks.register('testarWhisperWav', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.com.vozdacriacao.WhisperLocalTest'
}
tasks.named('check') { dependsOn testarWhisperWav }
