name: Compilar La Craft
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Testar lógica Java
        run: |
          mkdir -p /tmp/lacraft-test
          javac --release 17 -d /tmp/lacraft-test src/main/java/br/com/vozdacriacao/{BufferVoz,Pedido}.java tests/BufferVozTest.java
          java -cp /tmp/lacraft-test BufferVozTest
      - name: Compilar mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: la-craft-0.2.0
          path: build/libs/la-craft-0.2.0.jar
          if-no-files-found: error
