name: Compilar La Craft
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Testar lógica Java
        run: |
          mkdir -p /tmp/lacraft-test
          javac --release 17 -d /tmp/lacraft-test src/main/java/br/com/vozdacriacao/{BufferVoz,Pedido,AcoesTexto}.java tests/BufferVozTest.java
          java -cp /tmp/lacraft-test BufferVozTest
      - name: Embutir modelo de reconhecimento PT
        run: |
          mkdir -p src/main/resources/vozdacriacao
          curl --fail --location --retry 3 --max-time 180 https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip -o src/main/resources/vozdacriacao/modelo-pt.zip
          unzip -t src/main/resources/vozdacriacao/modelo-pt.zip
      - name: Compilar mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: la-craft-0.8.3
          path: build/libs/la-craft-0.8.3.jar
          if-no-files-found: error
      - name: Resolver modpack e dependências
        run: python3 modpack/montar.py build/libs/la-craft-0.8.3.jar
      - uses: actions/upload-artifact@v4
        with:
          name: La-Craft-Infinite-0.8.3-EXPANDIDO
          path: dist/La-Craft-Infinite-0.8.3-EXPANDIDO.zip
          if-no-files-found: error
