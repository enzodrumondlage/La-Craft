name: Compilar La Craft
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Testar lógica Java
        run: |
          mkdir -p /tmp/lacraft-test
          javac --release 17 -d /tmp/lacraft-test src/main/java/br/com/vozdacriacao/{BufferVoz,Pedido,AcoesTexto,CarroSpec}.java tests/BufferVozTest.java
          java -cp /tmp/lacraft-test BufferVozTest
      - name: Embutir modelo de reconhecimento PT
        run: |
          mkdir -p src/main/resources/vozdacriacao
          curl --fail --location --retry 3 --max-time 180 https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip -o src/main/resources/vozdacriacao/modelo-pt.zip
          unzip -t src/main/resources/vozdacriacao/modelo-pt.zip
      - name: Compilar mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: la-craft-0.9.13
          path: build/libs/la-craft-0.9.13.jar
          if-no-files-found: error
      - name: Resolver modpack e dependências
        run: python3 modpack/montar.py build/libs/la-craft-0.9.13.jar
      - name: Auditar todos os JARs e dependências internas
        run: python3 modpack/auditar.py dist/La-Craft-Infinite-0.9.13-LEVE.mrpack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Auditoria-La-Craft-0.9.13
          path: dist/auditoria-jars.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: La-Craft-Infinite-0.9.13-LEVE
          path: dist/La-Craft-Infinite-0.9.13-LEVE.zip
          if-no-files-found: error

  instalador:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: La-Craft-Infinite-0.9.13-LEVE
          path: pacote
      - name: Compilar EXE Windows
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /platform:x64 /optimize+ /out:Instalar-La-Craft-0.9.13-LEVE.exe /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll /reference:System.Web.Extensions.dll /resource:pacote/La-Craft-Infinite-0.9.13-LEVE.zip,modpack.zip installer/Instalador.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\Instalar-La-Craft-0.9.13-LEVE.exe --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Teste de instalação e backup no Windows
        shell: pwsh
        run: |
          & .\Instalar-La-Craft-0.9.13-LEVE.exe --ci-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Instalador-La-Craft-0.9.13-LEVE
          path: Instalar-La-Craft-0.9.13-LEVE.exe
          if-no-files-found: error
